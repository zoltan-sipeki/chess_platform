@if (replay$ | async; as replay) {
<chess-board [replay]="true" [squares]="squares" [moves]="moveList()" [activeColor]="activeColor()" [timer]="timer()"
    [players]="players()">
</chess-board>
<div class="card shadow-sm border-0">

    <div class="card-header bg-dark text-white">
        <div class="d-flex justify-content-between align-items-center">
            <span class="fw-semibold">Game Replay</span>
            <small class="text-light-emphasis">
                Move <strong>{{ cursor.value }}</strong> / {{ moveCount() }}
            </small>
        </div>
    </div>

    <div class="card-body">

        <!-- Move slider -->
        <div class="mb-4">
            <input type="range" class="form-range" min="0" [max]="moveCount()" [formControl]="cursor">

            <div class="d-flex justify-content-between small text-muted">
                <span>Start</span>
                <span>End</span>
            </div>
        </div>

        <!-- Replay controls -->
        <div class="d-flex justify-content-center align-items-center gap-3">

            <!-- Beginning -->
            <button type="button" class="btn btn-outline-secondary rounded-circle" style="width:48px;height:48px;"
                title="Go to beginning" (click)="skipBackward()">
                <i class="bi bi-skip-backward-fill"></i>
            </button>

            <!-- Previous -->
            <button type="button" class="btn btn-outline-primary rounded-circle" style="width:48px;height:48px;"
                title="Previous move" (click)="shiftCursor(-1)">
                <i class="bi bi-caret-left-fill"></i>
            </button>

            <!-- Move counter -->
            <div class="text-center px-2">
                <div class="fw-bold fs-5">{{ cursor.value }}</div>
                <small class="text-muted">of {{ moveCount() }}</small>
            </div>

            <!-- Next -->
            <button type="button" class="btn btn-primary rounded-circle" style="width:48px;height:48px;"
                title="Next move" (click)="shiftCursor(1)">
                <i class="bi bi-caret-right-fill"></i>
            </button>

            <!-- End -->
            <button type="button" class="btn btn-outline-secondary rounded-circle" style="width:48px;height:48px;"
                title="Go to end" (click)="skipForward()">
                <i class="bi bi-skip-forward-fill"></i>
            </button>

        </div>

    </div>

</div>


}
