<div ngbDropdown class="nav-item dropdown" display="dynamic" (openChange)="onOpen($event)" autoClose="outside">
    <a ngbDropdownToggle class="nav-link position-relative" role="button">
        <i class="bi bi-bell-fill"></i>
        @if (list().unread > 0) {
        <span class="position-absolute top-0 start-0 badge rounded-pill bg-danger" style="transform: translateX(-60%)">
            {{ list().unread }}
        </span>
        }
    </a>

    <div ngbDropdownMenu class="dropdown-menu p-0 shadow" style="width: 400px;">

        <div class="d-flex justify-content-between align-items-center px-3 py-2 border-bottom">
            <span class="fw-semibold">Notifications</span>
            <a routerLink="/dashboard/notifications" class="small text-decoration-none">View all</a>
        </div>

        <notification-list [maxSize]="5"></notification-list>

    </div>
</div>
